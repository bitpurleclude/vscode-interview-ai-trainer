# Centralized guardrails for all upper-bound style controls.
# Keep hard limits here instead of scattering constants in code.
version: 1

retrieval:
  # Hard clamp ranges for values coming from UI/skill config.
  limits:
    # Maximum number of merged hits per retrieval category.
    top_k:
      min: 1
      max: 50

    # Maximum query concurrency inside one retrieval kind.
    max_concurrency:
      min: 1
      max: 1024

    # Maximum embedding worker concurrency requested by retrieval settings.
    embedding_max_concurrency:
      min: 1
      max: 256

    # Maximum embedding worker concurrency used by warmup jobs.
    warmup_concurrency:
      min: 1
      max: 256

    # Similarity threshold range used during retrieval filtering.
    min_score:
      min: 0
      max: 1

    # Embedding request batch size range from retrieval settings.
    vector_batch_size:
      min: 1
      max: 256

    # Maximum characters per retrieval query sent to embedding.
    vector_query_max_chars:
      min: 64
      max: 4000

    # Query count per retrieval window before auto-splitting to next window.
    query_window_size:
      min: 1
      max: 64

    # Maximum concurrent question-level retrieval tasks.
    question_max_concurrency:
      min: 1
      max: 16

    # Maximum concurrent corpus-kind tasks per question.
    kind_max_concurrency:
      min: 1
      max: 4

  # Runtime defaults when skill config does not provide optional knobs.
  defaults:
    query_window_size: 8
    question_max_concurrency: 3
    kind_max_concurrency: 2

  # If one embedding request payload exceeds this size, split into sub-requests.
  embedding_request_split_threshold: 64

logging:
  # Structured log guardrails to keep output stable and machine-parseable.
  limits:
    # purpose: cap one log message text size before serialization.
    # unit: UTF-8 characters.
    # trigger behavior: truncate message and append a truncation marker when exceeded.
    # risk when too large: huge lines increase output latency and make troubleshooting noisy.
    message_max_chars: 4000

    # purpose: cap serialized detail payload size to avoid output channel flooding.
    # unit: UTF-8 characters after JSON serialization.
    # trigger behavior: detail is truncated with metadata about original length.
    # risk when too large: large payloads can freeze extension host output processing.
    detail_max_chars: 12000

    # purpose: bound recursive object traversal while sanitizing log details.
    # unit: nesting depth.
    # trigger behavior: deeper nodes are replaced with a depth-limit marker.
    # risk when too large: deep payloads raise CPU cost and may cause stack pressure.
    detail_max_depth: 6

    # purpose: cap object key count per level in structured detail payloads.
    # unit: number of keys.
    # trigger behavior: extra keys are dropped and count is recorded.
    # risk when too large: oversized objects reduce readability and increase memory overhead.
    detail_max_keys_per_object: 128

    # purpose: cap array item count per level in structured detail payloads.
    # unit: number of items.
    # trigger behavior: extra items are dropped and count is recorded.
    # risk when too large: long arrays create high-volume logs and hide critical signals.
    detail_max_items_per_array: 64

  policy:
    # purpose: keep critical diagnostics visible when trace log toggle is disabled.
    # unit: boolean flag.
    # trigger behavior: emit error-level events even when trace/info logs are off.
    # risk when too large: if disabled, production failures may become invisible during smoke tests.
    emit_error_when_trace_disabled: true
